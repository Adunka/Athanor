name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
      # --locked matters most here. Cargo 1.75 predates the MSRV-aware
      # resolver, so left to itself it resolves to the newest semver-compatible
      # dependency available — and some of those now ship manifests it cannot
      # parse at all. The committed lockfile is what keeps this job resolvable,
      # which is also why Cargo.lock is tracked rather than ignored.
      - run: cargo test --workspace --locked
